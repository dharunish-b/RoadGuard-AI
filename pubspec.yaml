name: roadguard
description: "RoadGuard - AI Powered Road Safety Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # GPS
  geolocator: ^14.0.2

  # Image Picker
  image_picker: ^1.2.0

  # Vibration
  vibration: ^3.1.3

  # Flashlight
  torch_light: ^1.1.0

  # Sound Player
  audioplayers: ^6.5.1

  # Background Service — keeps GPS monitoring alive after app is minimized
  flutter_background_service: ^5.0.5

  # Local Notifications — persistent "Monitoring active" status bar notification
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Icon
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

# -------------------------------------------------
# ROADGUARD APP ICON
# -------------------------------------------------

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/roadguard_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/roadguard_logo.png"